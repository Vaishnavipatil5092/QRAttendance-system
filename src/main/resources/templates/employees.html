<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Employees • QR Attendance</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brand-mark">QR</div><span>Attendance</span></div><div class="nav-title">Workspace</div><nav class="nav">
<a href="/"><span class="nav-icon">⌂</span><span>Dashboard</span></a><a class="active" href="/employees"><span class="nav-icon">👥</span><span>Employees</span></a><a href="/add-employee"><span class="nav-icon">＋</span><span>Add Employee</span></a><a href="/scan"><span class="nav-icon">▣</span><span>Scan QR</span></a><a href="/attendance-report"><span class="nav-icon">▤</span><span>Reports</span></a>
</nav></aside>
<main class="main">
<div class="topbar"><div><div class="eyebrow">People</div><h1>Employee directory</h1><p class="subtitle">Manage identities and their secure attendance QR codes.</p></div><a class="btn btn-primary" href="/add-employee">＋ Add employee</a></div>
<div class="card panel"><div class="panel-head"><div><div class="panel-title"><span id="count">0</span> employees</div><div id="status" class="subtitle">Loading...</div></div><div class="toolbar"><input id="search" class="search" placeholder="Search name or email"><button class="btn btn-secondary" id="downloadAll">Export directory</button></div></div>
<div class="table-wrap"><table><thead><tr><th>Employee</th><th>Email</th><th>QR status</th><th>Actions</th></tr></thead><tbody id="employeeBody"></tbody></table></div></div>
</main></div>
<script>
let employees=[];
const body=document.getElementById('employeeBody'),search=document.getElementById('search'),count=document.getElementById('count'),status=document.getElementById('status');
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function initials(n){return (n||'?').split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase()}
function render(){
 const q=search.value.trim().toLowerCase(), data=employees.filter(e=>(e.name||'').toLowerCase().includes(q)||(e.email||'').toLowerCase().includes(q));
 count.textContent=data.length;
 if(!data.length){body.innerHTML='<tr><td colspan="4"><div class="empty"><div class="empty-icon">👥</div><b>No employees found</b><div>Try another search or register a new employee.</div></div></td></tr>';return}
 body.innerHTML=data.map(e=>`<tr>
 <td><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${initials(e.name)}</div><div><b>${esc(e.name)}</b><div class="employee-email">ID #${e.id}</div></div></div></td>
 <td>${esc(e.email)}</td><td><span class="badge badge-green">● QR ACTIVE</span></td>
 <td><div class="table-actions"><a class="icon-btn" target="_blank" href="/api/employees/${e.id}/qrcode">View QR</a><a class="icon-btn" href="/scan">Scan</a></div></td></tr>`).join('');
}
async function load(){try{const r=await fetch('/api/employees');if(!r.ok)throw new Error('HTTP '+r.status);employees=await r.json();status.textContent='QR identities ready';render()}catch(e){status.textContent='Could not load employees: '+e.message}}
search.addEventListener('input',render);
document.getElementById('downloadAll').addEventListener('click',()=>{
 const rows=[['ID','Name','Email'],...employees.map(e=>[e.id,e.name,e.email])];
 const csv=rows.map(r=>r.map(x=>`"${String(x??'').replaceAll('"','""')}"`).join(',')).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='employee-directory.csv';a.click();URL.revokeObjectURL(a.href);
});
load();
</script></body></html>
